[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtree"
version = "1.0.0"
description = "Multi-view, multi-resolution tree-species recognition from single-tree LiDAR scans (FOR-species20K)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["lidar", "point cloud", "tree species", "forestry", "multi-view", "FOR-species20K"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0.3",
    "numpy>=1.24",
    "pillow>=10.0",
    "laspy[lazrs]>=2.5",
    "safetensors>=0.4",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "gdown>=5.2",
    "plyfile>=1.0",
]

[project.optional-dependencies]
geometry = ["lightgbm>=4.0", "scipy>=1.10", "imbalanced-learn>=0.12"]
train = ["wandb>=0.16", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["mvtree[geometry,train,dev]"]

[project.scripts]
mvtree = "mvtree.cli:main"

[tool.setuptools.packages.find]
include = ["mvtree*"]

[tool.setuptools.package-data]
"mvtree.web" = ["static/*"]

# uv: CUDA 12.8 wheels on Linux/Windows (RTX 20xx-50xx, driver >= 570),
# default PyPI wheels elsewhere (CPU / Apple MPS). For an older driver,
# change the index URL to .../cu126 or .../cu124.
[tool.uv]
# Pin the lock file to the PyTorch release the weights were validated with.
constraint-dependencies = ["torch==2.9.*", "torchvision==0.24.*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
